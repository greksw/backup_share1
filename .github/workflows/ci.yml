name: Shell CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: bash -n backup-job.sh

      - name: ShellCheck
        run: shellcheck backup-job.sh

      - name: Validate safe examples
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x backup-job.sh
          ./backup-job.sh --config config/job-sync.conf.example --check-config
          ./backup-job.sh --config config/job-archive.conf.example --check-config

      - name: Check for obvious embedded secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -REn \
            '(TOKEN=|BOT_TOKEN=|CHAT_ID=[0-9]+|password=[^r][^e][^p]|ZIP_PASSWORD=| -p[^ ]{4,})' \
            backup-job.sh README.md systemd config/job-*.conf.example
